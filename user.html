<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Persona</title>
</head>
<body>
  <script>
    try {
      sessionStorage.setItem('persona_force_basic', '1');
      Object.keys(localStorage).forEach((key) => {
        if (key.startsWith('persona_admin_enabled_')) localStorage.removeItem(key);
      });
    } catch {}
    location.replace('./index.html?basic=1');
  </script>
</body>
</html>
